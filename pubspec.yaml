name: startapp
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  app_links: ^7.2.1
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.0.0
  flutter_local_notifications: ^19.4.2
  flutter_launcher_icons: ^0.14.4
  google_fonts: ^8.2.1
  google_sign_in: ^6.2.1
  http: ^1.6.0
  image_picker: ^1.2.3
  socket_io_client: ^3.1.6
  supabase_flutter: ^2.17.2
  shared_preferences: ^2.5.3
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - shorebird.yaml
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/nexora_icon.png"
  adaptive_icon_background: "#00A86B"
  adaptive_icon_foreground: "assets/icon/nexora_icon.png"
