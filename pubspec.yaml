name: startapp
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  app_links: ^7.2.1
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.0.0
  flutter_local_notifications: ^22.3.2
  flutter_launcher_icons: ^0.14.4
  google_fonts: ^9.0.0
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  flutter_login_facebook:
  http: ^1.6.0
  image_picker: ^1.2.3
  socket_io_client: ^3.1.6
  supabase_flutter: ^2.17.2
  shared_preferences: ^2.5.3
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  shorebird_code_push: ^2.0.7
  geolocator: ^14.0.3
  url_launcher: ^6.3.2
  device_info_plus: 
  share_plus: ^13.3.0
  provider: ^6.1.5+1
  pay: ^3.3.0
  web: ^1.1.1
  flutter_map: ^8.3.2
  latlong2: 0.9.1
  flutter_map_marker_cluster: 8.2.2
  google_maps_flutter: ^2.18.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
