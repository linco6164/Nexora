<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <meta name="google-signin-client_id" content="704537003987-nhbquge06mbasglpsush74qpj8a42t1n.apps.googleusercontent.com">
  <meta property="fb:app_id" content="2067017487543159">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="startapp">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>startapp</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    (() => {
      let resolveFacebookReady;
      window.nexoraFacebookReady = new Promise((resolve) => {
        resolveFacebookReady = resolve;
      });

      window.fbAsyncInit = function () {
        FB.init({
          appId: '2067017487543159',
          cookie: true,
          xfbml: false,
          version: 'v21.0'
        });
        resolveFacebookReady();
      };

      window.nexoraFacebookLogin = async function () {
        await Promise.race([
          window.nexoraFacebookReady,
          new Promise((_, reject) => setTimeout(
            () => reject(new Error('SDK-ul Facebook nu a putut fi încărcat.')),
            8000
          ))
        ]);

        return new Promise((resolve, reject) => {
          FB.login((response) => {
            const token = response?.authResponse?.accessToken;
            if (token) {
              resolve(token);
              return;
            }

            reject(new Error(
              response?.status === 'not_authorized'
                ? 'Aplicația Facebook nu a fost autorizată.'
                : 'Autentificarea cu Facebook a fost anulată.'
            ));
          }, {
            scope: 'public_profile,email',
            return_scopes: true
          });
        });
      };

      const script = document.createElement('script');
      script.async = true;
      script.defer = true;
      script.crossOrigin = 'anonymous';
      script.src = 'https://connect.facebook.net/ro_RO/sdk.js';
      document.head.appendChild(script);
    })();
  </script>
  <script>
    (() => {
      let googlePaySdkPromise;

      function loadGooglePaySdk() {
        if (window.google?.payments?.api) {
          return Promise.resolve();
        }

        if (!googlePaySdkPromise) {
          googlePaySdkPromise = new Promise((resolve, reject) => {
            const script = document.createElement('script');
            script.async = true;
            script.src = 'https://pay.google.com/gp/p/js/pay.js';
            script.onload = resolve;
            script.onerror = () => reject(new Error(
              'SDK-ul Google Pay nu a putut fi încărcat.'
            ));
            document.head.appendChild(script);
          });
        }

        return googlePaySdkPromise;
      }

      window.nexoraGooglePay = {
        mount: async function (
          elementId,
          rawConfiguration,
          total,
          currencyCode,
          onResult,
          onError
        ) {
          try {
            await loadGooglePaySdk();

            const host = document.getElementById(elementId);
            if (!host) {
              throw new Error('Containerul Google Pay nu este disponibil.');
            }

            host.replaceChildren();

            const parsedConfiguration = JSON.parse(rawConfiguration);
            const configuration = parsedConfiguration.data || parsedConfiguration;
            const paymentsClient = new google.payments.api.PaymentsClient({
              environment: configuration.environment || 'TEST'
            });

            const readinessRequest = {
              apiVersion: configuration.apiVersion || 2,
              apiVersionMinor: configuration.apiVersionMinor || 0,
              allowedPaymentMethods: configuration.allowedPaymentMethods
            };
            const readiness = await paymentsClient.isReadyToPay(readinessRequest);

            if (!readiness.result) {
              throw new Error('Google Pay nu este disponibil pe acest dispozitiv.');
            }

            const button = paymentsClient.createButton({
              buttonColor: configuration.buttonColor || 'black',
              buttonType: 'buy',
              buttonSizeMode: 'fill',
              onClick: async () => {
                try {
                  const request = {
                    ...configuration,
                    transactionInfo: {
                      ...(configuration.transactionInfo || {}),
                      countryCode:
                        configuration.transactionInfo?.countryCode || 'RO',
                      currencyCode,
                      totalPriceStatus: 'FINAL',
                      totalPrice: total
                    }
                  };

                  delete request.buttonColor;
                  const paymentData = await paymentsClient.loadPaymentData(request);
                  onResult(JSON.stringify(paymentData));
                } catch (error) {
                  if (error?.statusCode === 'CANCELED') return;
                  onError(
                    error?.statusMessage ||
                    error?.message ||
                    'Google Pay nu a putut iniția plata.'
                  );
                }
              }
            });

            button.style.width = '100%';
            button.style.height = '56px';
            host.appendChild(button);
          } catch (error) {
            onError(
              error?.statusMessage ||
              error?.message ||
              'Google Pay nu este disponibil.'
            );
          }
        }
      };
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
